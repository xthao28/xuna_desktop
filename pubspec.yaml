name: xuna_desktop
description: "XUNA Desktop Host Agent (Windows & macOS) over XTP v1."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.6
  get: ^4.7.2
  hotkey_manager: ^0.2.3
  launch_at_startup: ^0.5.1
  path_provider: ^2.1.5
  qr_flutter: ^4.1.0
  tray_manager: ^0.2.4
  web_socket_channel: ^3.0.1
  window_manager: ^0.4.3
  xuna_xtp:
    path: packages/xuna_xtp

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
